/* ---------- the seal (AI disclosure), the yellow line, the glyph ---------- */
const SEAL_RING='AI-ASSISTED · 约 60% · STORY & TEXT BY THE AUTHOR · 故事与文本由作者完成 · ENDND × CLAUDE · ';
function ringText(c,s,r,size,rot,prog=1,color){c.save();c.rotate(rot);c.font=`600 ${size}px ${UI}`;c.fillStyle=color;
  const chars=[...s],ws=chars.map(ch=>c.measureText(ch).width),tot=ws.reduce((a,b)=>a+b,0),gap=(2*Math.PI*r-tot)/chars.length;let acc=0;

/* ============================== easing & the camera ============================== */
/* cubic-bezier, solved by bisection (deterministic, cheap enough for a few calls a frame) */
function cubicBezier(x1,y1,x2,y2){const bx=t=>3*x1*(1-t)*(1-t)*t+3*x2*(1-t)*t*t+t*t*t,by=t=>3*y1*(1-t)*(1-t)*t+3*y2*(1-t)*t*t+t*t*t;
  return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,t=x;for(let i=0;i<28;i++){t=(lo+hi)/2;if(bx(t)<x)lo=t;else hi=t}return by((lo+hi)/2)}}
const EZ={E0:cubicBezier(0,0,0,1),EIO:cubicBezier(.65,0,.35,1),EIN:cubicBezier(.55,0,1,.45),LIN:x=>x};
/* camera keys: [time, centre x, centre y, scale, rotation, ease]. 'cut' jumps; any other ease travels from the key before it */
const CAMK=[

  [8.7,860,520,1.18,.012,'cut'],[11.95,1080,540,1,0,'E0'],
  [12.0,1460,620,1.55,0,'cut'],[14.6,1000,560,1.06,0,'E0'],[16.1,960,540,1,0,'EIO'],
  [16.1,960,700,1.3,0,'cut'],[19.25,960,420,1.04,0,'E0'],
  [19.3,1200,480,1.9,.02,'cut'],[22.0,960,540,1,0,'E0'],
  [22.0,640,430,1.35,-.02,'cut'],[24.4,1240,540,1.05,0,'E0'],
  [24.45,330,600,3.4,0,'cut'],[26.0,960,540,1,0,'E0'],
  [26.0,960,540,1,0,'cut'],[27.6,880,500,1.3,-.01,'EIN'],

function camKeys(t){let a=0;for(let k=0;k<CAMK.length;k++)if(CAMK[k][0]<=t)a=k;const A=CAMK[a],B=CAMK[a+1];
  if(B&&B[5]!=='cut'&&t<B[0]){const u=EZ[B[5]]((t-A[0])/(B[0]-A[0]));return{cx:lerp(A[1],B[1],u),cy:lerp(A[2],B[2],u),s:lerp(A[3],B[3],u),r:lerp(A[4],B[4],u)}}
  if(B&&B[5]!=='cut'&&t>=B[0])return{cx:B[1],cy:B[2],s:B[3],r:B[4]};
  return{cx:A[1],cy:A[2],s:A[3],r:A[4]}}

  c.beginPath();c.moveTo(-16,-80);c.quadraticCurveTo(0,-140,16,-80);c.lineTo(9,150);c.lineTo(-9,150);c.closePath();c.fill();
  c.beginPath();c.roundRect(-82,136,164,16,8);c.fill();c.fillStyle=hole;c.beginPath();c.arc(0,-58,10,0,6.2832);c.fill();c.restore()}
/* wind: long curves whose dashes travel; dir 1 = left to right */
function wind(c,t,x,y,w,h,n,col,a=1,sp=260,dir=1){c.save();c.strokeStyle=col;c.globalAlpha*=a;c.lineCap='round';
  for(let k=0;k<n;k++){const yy=y+(k+.5)*h/n,amp=10+hh(k*7)*26,ph=hh(k*3)*6.28,len=w*(.18+hh(k*5)*.22);

  c.fillStyle=col;const n=22;for(let i=0;i<n;i++){const u=i/(n-1),yy=y+h-(i+1)*h/n,bh=h/n*lerp(.95,.12,u);if(i/n<p)c.fillRect(x,yy,w,bh)}c.restore()}
/* nine squares on the grid: the yards; lit = how many are run */
function yards(c,x,y,cell,lit,col,a=1,fall=0){for(let i=0;i<9;i++){const xx=x+i*(cell+24),dy=fall?eIn(clamp(fall*1.6-i*.08))*700:0;
  c.save();c.globalAlpha*=a;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1.2;if(i<lit)c.fillRect(xx,y+dy,cell,cell);else c.strokeRect(xx+.5,y+dy+.5,cell-1,cell-1);
  c.restore();cap(c,String(9-i).padStart(2,'0'),xx+8,y+dy+20,i<lit?(col===COBALT?PAPER:COBALT):col,{a:a*.9,size:11})}}

function orbit(c,t,cx,cy,R,col,a=1,o={}){c.save();c.globalAlpha*=a;
  if(!o.noDisc){c.save();c.beginPath();c.arc(cx,cy,R,0,6.2832);c.clip();c.fillStyle=col;for(let i=0;i<30;i++){const yy=cy-R+i*2*R/30;c.fillRect(cx-R,yy,2*R,2*R/30*lerp(.15,.9,i/29))}c.restore();
    c.strokeStyle=col;c.lineWidth=1.4;c.beginPath();c.arc(cx,cy,R,0,6.2832);c.stroke()}
  const rx=R*2.7,ry=R*.78,rot=-.22,th=t*.35+(o.ph||0);c.strokeStyle=col;c.lineWidth=1.2;c.setLineDash([3,7]);c.beginPath();c.ellipse(cx,cy,rx,ry,rot,0,6.2832);c.stroke();c.setLineDash([]);

/* stars as plus marks, scattered by a hash; they breathe */
function stars(c,t,x,y,w,h,n,col,a=1,sd=1){c.save();c.strokeStyle=col;c.lineWidth=1.4;for(let k=0;k<n;k++){const px=x+hh(k*31+sd)*w,py=y+hh(k*17+sd*7)*h,s=(3+hh(k*5+sd)*9)*(.6+.4*Math.sin(t*2.2+k));

/* a flock of gliders in Vs, drifting */
function flock(c,t,x,y,w,h,col,a=1,sp=60,sd=3){for(let g=0;g<7;g++){const n=5+(g%3)*2,s=.09+hh(g*7+sd)*.09,gx=x+((hh(g*13+sd)*w+t*sp*(1+hh(g)))%(w+400))-200,gy=y+hh(g*29+sd)*h;

/* ============================== the clock (same as PV 01) ============================== */
let t=0,playing=false,clk0=0,t0=0,started=false,hudForced=false;
const hud=document.getElementById('hud');
const now=()=>AU.clock==='audio'?AU.ctx.currentTime:performance.now()/1000;

function stopAudio(){if(AU.src){try{AU.src.stop()}catch(e){}AU.src.disconnect();AU.src=null}}
function syncAudio(){if(!playing||!AU.ctx||AU.ctx.state!=='running'||!AU.buf)return;const cur=clamp(t0+(now()-clk0),0,DUR);AU.clock='audio';t0=cur;clk0=AU.ctx.currentTime;startAudio(cur)}
function play(){if(!ready||playing)return;if(t>=DUR)t=0;
  if(!AU.ctx){try{AU.ctx=new AudioContext();AU.gain=AU.ctx.createGain();AU.gain.gain.value=AU.muted?0:1;AU.gain.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
  playing=true;started=true;AU.clock='perf';clk0=now();t0=t;
  if(AU.ctx){if(AU.ctx.state==='running')syncAudio();else AU.ctx.resume().then(syncAudio).catch(()=>{})}
  updHud();requestAnimationFrame(loop)}
function pause(){if(!playing)return;t=clamp(t0+(now()-clk0),0,DUR);playing=false;stopAudio();render(t);updHud()}
function seek(x){t=clamp(+x||0,0,DUR);if(playing){clk0=now();t0=t;if(AU.clock==='audio')startAudio(t)}render(t);updHud();return t}

  hud.textContent=`飞 Fly · PV 02 — ${t.toFixed(2)} / ${DUR.toFixed(1)} s${AU.buf?'':' · 音轨生成中'}\n空格 播放/暂停 · ← → 逐帧 (Shift 1 s) · 0 回到开头 · M 静音${AU.muted?'（已静音）':''} · W 导出音轨 · H 隐藏提示`}
