<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞 Fly · PV 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
/* the stage is one 1920×1080 canvas, scaled to fit the window; nothing else is on screen while it plays */
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0d}
#pv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#F2ECDF}
#hud{position:fixed;left:12px;bottom:10px;font:12px/1.6 Inter,"Noto Sans SC",sans-serif;color:#cfcac0;background:rgba(11,11,13,.72);padding:6px 10px;border-radius:2px;letter-spacing:.04em;pointer-events:none;white-space:pre}
#hud[hidden]{display:none}
</style></head><body>
<canvas id="pv" width="1920" height="1080"></canvas>
<div id="hud">载入中…</div>
<script>
/* ============================================================================================
   《飞 Fly》PV 01 — 约 32.5 秒，1920×1080
   ▸ 所有画面只由一个时间变量 t（秒）决定：render(t)。没有 setTimeout / CSS 动画 / 未播种的随机数。
   ▸ window.pv = { duration, seek(t), play(), pause() }；?t=12.5 打开即停在第 12.5 秒。
   ▸ 打开后等空格开始；结尾停在定版，不循环。
   ▸ 画风函数（水彩、蜡笔、纸纹、草坡、滑翔机、地球、梦）原样取自 index_v8.html，由 build 脚本拼进来（见下方 LIB 段）。
   键：空格 播放/暂停 · ← → 前后一帧(1/60s，Shift = 1s) · 0 回到开头 · M 静音 · W 导出音轨 .wav · H 显示/隐藏提示
   ============================================================================================ */
'use strict';
/* ★ 文案都在这里 ★ */
const DISCLOSURE='本作由 AI 辅助制作（约 60%），详细占比见附图 · 故事与文本由作者完成';
const TAGLINE='每个人都飞过一次，在梦里。';          // ← 宣传语（PV 作者写的，可替换）
const CAPS=[ /* 字幕：全部是游戏里的原句 */
  {t0:3.5, t1:8.1, tab:'第二章 · 最高的地方', s:'风刚好从身后推过来，他就跑了。'},
  {t0:12.8,t1:16.1,tab:'第二章 · 最高的地方', s:'他忽然想，这大概就是最高的地方。'},
  {t0:17.9,t1:21.3,tab:'第四章 · 鸟群',       s:'飞翔好像和走路一样简单。'},
  {t0:21.9,t1:24.7,tab:'第五章 · 十一月',     s:'天边烧成橘红色，云层被镶了一圈金边。'},
];
const DUR=32.5;

/* scratch layers the library draws through (declared before it, as in the storyboard) */
const G={idx:0};
let toothC=null,cpat=null;
const ccan=document.createElement('canvas');ccan.width=1920;ccan.height=1080;const cctx=ccan.getContext('2d');
const mcan=document.createElement('canvas');mcan.width=960;mcan.height=540;const mctx=mcan.getContext('2d');

/* ======================= LIB: verbatim from index_v8.html ======================= */
/*@@LIB@@*/
/* ======================= /LIB ======================= */

const X=document.getElementById('pv').getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const TX=tmp.getContext('2d');
const tmp2=document.createElement('canvas');tmp2.width=W;tmp2.height=H;const TX2=tmp2.getContext('2d');
const grainC=document.createElement('canvas');grainC.width=W;grainC.height=H;
let ready=false,bleedLayers=[],dotItems=[];
const LX='"LXGW WenKai","Noto Sans SC",sans-serif',CN='"Noto Sans SC","Microsoft YaHei",sans-serif',UI='Inter,"Noto Sans SC",sans-serif',DISP='"Inter Tight",Inter,"Noto Sans SC",sans-serif';

/* ---------- small drawing helpers ---------- */
function reset(c){c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none';c.letterSpacing='0px';c.textAlign='left';c.textBaseline='alphabetic'}
function text(c,s,x,y,font,color,o={}){if((o.a??1)<=0)return;c.save();c.font=font;c.fillStyle=color;c.globalAlpha*=o.a??1;c.letterSpacing=(o.ls||0)+'px';c.textAlign=o.align||'left';
  if(o.halo){c.shadowColor=o.halo;c.shadowBlur=8}c.fillText(s,x,y);c.restore()}
const cap=(c,s,x,y,color,o={})=>text(c,s.toUpperCase(),x,y,`${o.w||400} ${o.size||12}px ${UI}`,color,{ls:(o.size||12)*.09,...o});
function paper(c){c.fillStyle=PAPER;c.fillRect(0,0,W,H)}
function gridLines(c,a,prog=1){if(a<=0)return;c.save();c.fillStyle=COBALT;
  for(let i=1;i<=12;i++)for(const x of [COL(i),COLR(i)]){const k=i-1,p=typeof prog==='function'?prog(k):prog;if(p<=0)continue;c.globalAlpha=a;c.fillRect(x,80,1,920*p)}
  for(const [y,k] of [[80,0],[1000,1]]){const p=typeof prog==='function'?prog(k*4):prog;c.globalAlpha=a;c.fillRect(0,y,W*p,1)}c.restore()}
/* registration marks, cobalt and yellow; off = how far the yellow plate has crept */
function regMarks(c,a,off=0){if(a<=0)return;const pts=[[60,40],[1860,40],[60,1040],[1860,1040]];c.save();c.globalCompositeOperation='multiply';c.lineWidth=1.25;
  for(const [col,dx,dy] of [[COBALT,off?5:0,off?-3:0],[SUN,off?-2:0,off?1:0]]){c.strokeStyle=col;c.globalAlpha=a;
    for(const [x0,y0] of pts){const x=x0+dx,y=y0+dy;c.beginPath();c.arc(x,y,10,0,6.2832);c.moveTo(x-20,y);c.lineTo(x+20,y);c.moveTo(x,y-20);c.lineTo(x,y+20);c.stroke()}}
  c.restore()}
/* T2: the water stain — p 0→1 spreads from (cx,cy); mode 'in' keeps the inside of target, 'out' cuts it away */
function bleed(target,p,mode,cx=960,cy=540){
  mctx.setTransform(1,0,0,1,0,0);mctx.globalCompositeOperation='source-over';mctx.globalAlpha=1;mctx.clearRect(0,0,960,540);
  mctx.save();mctx.translate(cx/2,cy/2);const rad=lerp(4,1300,eOut(clamp(p)));mctx.scale(rad,rad);mctx.fillStyle='#000';
  for(const Lp of bleedLayers){mctx.globalAlpha=.11;fillPoly(mctx,Lp)}mctx.restore();
  target.save();target.setTransform(1,0,0,1,0,0);target.globalAlpha=1;target.globalCompositeOperation=mode==='in'?'destination-in':'destination-out';target.drawImage(mcan,0,0,W,H);target.restore()}
/* T3: the twelve columns, 30 ms apart; cover = falling from the top, reveal = lifting back up */
function colStrips(c,ms,cover,color){c.save();c.fillStyle=color;
  for(let i=1;i<=12;i++){const l=i===1?0:COL(i)-12,r=i===12?W:COLR(i)+12,p=eIO(clamp((ms-(i-1)*30)/450)),h=(cover?p:1-p)*H;if(h>0)c.fillRect(l,0,r-l+1,h)}c.restore()}

/* ============================== the shots ============================== */
/* A · 0–2.6 s: one quiet line on the proof paper */
function shotA(c,t){paper(c);gridLines(c,.09);
  text(c,DISCLOSURE,960,548,`400 26px ${CN}`,COBALT,{a:eOut(seg(t,.15,.7)),ls:1.6,align:'center'});
  cap(c,'Endnd × Claude Opus 5.5 — 2026.10',120,1044,COBALT,{a:.75*seg(t,.3,.8)})}

/* B · the run: from behind him up the slope, nine yards, and the ground lets go (drawChase, on the PV clock) */
const B0=2.6,LIFT=3.9;
const spAt=lt=>lt<LIFT?lerp(.35,3.2,eIn(clamp(lt/LIFT))):3.2+(lt-LIFT)*.9;
const flDAt=lt=>{let d=0;const n=Math.ceil(Math.max(0,lt)/.01);for(let k=0;k<n;k++)d+=spAt((k+.5)*.01)*.01;return d};
const yardAt=lt=>clamp(9-Math.floor(seg(lt,.5,LIFT)*9.99),0,9);
function shotB(c,t,v){const lt=t-B0,ts=t,sp=spAt(lt),flD=flDAt(lt);
  const pitch=eIn(seg(lt,LIFT-.5,LIFT+2.2))*940,air=seg(lt,LIFT,LIFT+.8),bob=Math.sin(ts*17)*Math.min(5,sp*1.4)*(1-air),vpX=960,y0=575+pitch+bob;
  c.globalCompositeOperation='source-over';c.globalAlpha=1;
  c.drawImage(FL.sky,0,Math.max(0,(1080-pitch*.6)/2),960,540,0,0,W,H);
  for(let k=0;k<2;k++){const cl=BGS.ascent.clouds[k+1],cx=((300+k*900-ts*(14+k*6)-flD*40)%2600+2600)%2600-400,cy=170+k*130+pitch*.5;c.globalAlpha=.9;c.drawImage(cl.can,cx-cl.cw*.3,cy-cl.ch*.3,cl.cw*.6,cl.ch*.6)}
  c.globalAlpha=1;c.drawImage(FL.ground,0,0,960,540,0,pitch+bob,W,H);
  crayonPass(c,g=>{
    drawItems(g,FL.skyItems,0,pitch*.5,1,0,v);drawItems(g,FL.groundItems,0,pitch+bob,1,0,v);
    for(let k=0;k<58;k++){const u=(hh(k*31+7)-.5)*7,z=(((hh(k*17+3)*11-flD)%11)+11)%11+.7,sx=vpX+u*640/z,sy=y0+430/z;
      if(sy>H+60||sy<-20||sx<-100||sx>W+100)continue;const h=Math.min(96,72/z),w=h*.9;
      crayon(g,densify([{x:sx-w*.5,y:sy},{x:sx-w*.3,y:sy-h},{x:sx-w*.1,y:sy},{x:sx+w*.12,y:sy-h*.8},{x:sx+w*.3,y:sy},{x:sx+w*.46,y:sy-h*.6},{x:sx+w*.6,y:sy}],4),'#55764A',Math.max(2.2,7/Math.sqrt(z)),mulberry32(k*7919+v*104729+1),0,0,undefined,k*131+v*17)}
    if(sp>2.4){g.save();g.globalAlpha=.55*clamp((sp-2.4)/.6);g.strokeStyle='#F4F1E6';g.lineWidth=2.4;g.lineCap='round';
      for(let k=0;k<12;k++){const a=.12+hh(k*5+1)*(Math.PI-.24),d0=((hh(k*9+2)*900+flD*260)%900)+140,len=60+sp*34;
        g.beginPath();g.moveTo(vpX+Math.cos(a)*d0,y0+Math.sin(a)*d0*.5);g.lineTo(vpX+Math.cos(a)*(d0+len),y0+Math.sin(a)*(d0+len)*.5);g.stroke()}g.restore()}});
  const lift=eIn(seg(lt,LIFT-.3,LIFT+1.8))*120+Math.sin(ts*1.3)*6*air;
  flightGlider(c,v,ts*1000,{eng:true,dy:bob*.6-lift,rot:sp>0?Math.sin(ts*11)*.012*Math.min(1,sp/3)*(1-air)+Math.sin(ts*.9)*.02*air:0});
  /* the yard counter: nine to none, then it lifts away with him */
  const ya=seg(lt,.15,.55)*(1-seg(lt,LIFT+.1,LIFT+.7));if(ya>0){const yy=120-eIn(seg(lt,LIFT+.1,LIFT+.7))*60,xx=1540+(1-eOut(seg(lt,.15,.55)))*80;
    c.save();c.globalAlpha=ya;c.beginPath();c.rect(xx,yy,260,180);c.clip();c.fillStyle=COBALT;c.fillRect(xx,yy,260,180);
    cap(c,'码 · Yards',xx+14,yy+24,PAPER);cap(c,String(9-yardAt(lt)).padStart(2,'0')+' / 09',xx+246,yy+24,PAPER,{align:'right',a:.75});
    text(c,String(yardAt(lt)),xx+8,yy+168,`500 170px ${DISP}`,PAPER,{ls:-8});c.restore()}}

/* the altimeter: one decade a step, ground to the moon */
const ALT_L=['地面 · 0 m','1 km','10 km · 云层','100 km · 卡门线','1 000 km','10 000 km','384 400 km · 月球'];
const ALT_K=[[6.4,0],[8.0,.3],[8.8,1],[10.0,2],[10.9,3],[11.5,5],[12.0,6]];
function altP(t){if(t<=ALT_K[0][0])return 0;for(let k=1;k<ALT_K.length;k++){const [t1,p1]=ALT_K[k],[t0,p0]=ALT_K[k-1];if(t<=t1)return lerp(p0,p1,eSine((t-t0)/(t1-t0)))}return 6}
const altM=p=>p<1?p*1000:p<5?1000*Math.pow(10,p-1):1e7*Math.pow(38.44,p-5);
const fmtAlt=m=>m<1000?Math.round(m)+' m':Math.round(m/1000).toLocaleString('fr-FR').replace(/ | /g,' ')+' km';
function altimeter(c,t,dk){const a=seg(t,6.6,7.3)*(1-seg(t,12.4,13.1));if(a<=0)return;const x0=1590+(1-eOut(seg(t,6.6,7.5)))*80,y0=130,col=dk>.5?PAPER:COBALT,halo=dk>.5?'rgba(8,10,28,.9)':'rgba(242,236,223,.9)';
  c.save();c.globalAlpha=a;c.fillStyle=col;c.fillRect(x0+208,y0,1,640);
  ALT_L.forEach((l,i)=>{const y=y0+640-i*640/6;c.fillRect(x0+196,y,12,1);text(c,l,x0+190,y+5,`400 11px ${UI}`,col,{ls:.5,align:'right',halo})});
  for(let i=0;i<=30;i++)c.fillRect(x0+203,y0+640-i*640/30,5,1);
  const p=altP(t),my=y0+640-p*640/6-12;c.fillStyle=COBALT;c.fillRect(x0+114,my,96,24);text(c,fmtAlt(altM(p)),x0+202,my+16,`500 11px ${UI}`,PAPER,{align:'right'});
  c.restore()}

/* C1 · into the cloud, through it, and the sky scrolls past: the deeper blue, the violet, the black */
const C0=8.4;
function paintWorldPV(c,wd,camY,v,ts){
  c.globalCompositeOperation='source-over';c.globalAlpha=1;c.drawImage(wd.base,0,Math.max(0,camY/2),960,540,0,0,W,H);
  for(const cl of wd.clouds)if(!cl.front)drawCloudW(c,cl,camY,ts);
  crayonPass(c,g=>{for(const it of wd.items){const b=it.bb;if(b.y1-camY<-40||b.y0-camY>H+40)continue;const r=mulberry32(it.id*7919+v*104729+1);
    if(it.k==='f'){g.save();pathPoly(g,it.clip,0,-camY);g.clip();crayon(g,it.pts,it.color,it.w,r,0,-camY,it.pts.length,it.id*131+v*17);g.restore()}
    else crayon(g,it.pts,it.color,it.w,r,0,-camY,it.pts.length,it.id*131+v*17)}});
  for(const cl of wd.clouds)if(cl.front)drawCloudW(c,cl,camY,ts);
  const ly=150-camY;if(ly>-30&&ly<H){c.fillStyle='rgba(242,236,223,.75)';c.fillRect(120,ly,1680,1);text(c,'地月系的边缘 · 384 400 km',120,ly-10,`500 13px ${CN}`,'rgba(242,236,223,.75)')}}
function cloudRush(c,v,lt,ts){const cl=BGS.ascent.clouds,vp={x:1220,y:460};
  c.globalCompositeOperation='source-over';c.globalAlpha=1;c.drawImage(FL.sky,0,Math.max(0,620-lt*60)/2,960,540,0,0,W,H);
  const list=[];for(let k=0;k<12;k++){const z=1.15+k*.5-lt*1.45;if(z>.3&&z<7)list.push({c:cl[k%cl.length],z,k})}list.sort((a,b)=>b.z-a.z);
  const one=q=>{const ux=(hh(q.k*13+1)-.5)*1.7,uy=(hh(q.k*29+2)-.5)*.9,s=.75/q.z,x=vp.x+ux*820/q.z,y=vp.y+uy*520/q.z;
    c.globalAlpha=clamp((q.z-.3)/.4)*clamp((7-q.z)/1.2);c.drawImage(q.c.can,x-q.c.cw*s/2,y-q.c.ch*s/2,q.c.cw*s,q.c.ch*s)};
  list.filter(q=>q.z>=.95).forEach(one);c.globalAlpha=1;
  flightGlider(c,v,ts*1000,{eng:true,dy:Math.sin(ts*2.1)*6});
  list.filter(q=>q.z<.95).forEach(one);c.globalAlpha=1}
function shotC1(c,t,v){const lt=t-C0,ts=t,clt=.9+lt*1.5,fog=.82*Math.max(0,1-Math.abs(clt-2.7)/1.3);
  if(lt<1.6)cloudRush(c,v,clt,ts);
  if(lt>=1.0){const camY=lerp(2400,120,eIO(seg(lt,1.0,3.9))),gone=eIn(seg(lt,2.2,3.15))*760;
    if(lt<1.6){TX.setTransform(1,0,0,1,0,0);TX.clearRect(0,0,W,H);deep(TX,camY,v,ts,gone);c.globalAlpha=eIO(seg(lt,1.0,1.6));c.drawImage(tmp,0,0);c.globalAlpha=1}
    else deep(c,camY,v,ts,gone)}
  if(fog>0){c.globalAlpha=fog;c.fillStyle='#F7F5EF';c.fillRect(0,0,W,H);c.globalAlpha=1}}
function deep(c,camY,v,ts,gone=0){c.save();c.translate(960,540);c.scale(1.18,1.18);c.translate(-960,-540);paintWorldPV(c,BGS.ascent,camY,v,ts);c.restore();
  if(camY<600)twinkle(c,ts*1000,null,seg(600-camY,0,400));
  if(gone<700)flightGlider(c,v,ts*1000,{eng:true,dy:Math.sin(ts*1.6)*8+gone,s:GL_C.s*(1+gone/1400)})}

/* C2 · the grand view: his earth, the moon coming round, the colours shaken loose (翻折。蓝紫色。青光。) — and him on his rock, looking */
const C2=11.6;
function shotC2(c,t,v){const lt=t-C2,z=1+.035*eSine(clamp(lt/5.2));
  c.save();c.translate(1000,560);c.scale(z,z);c.translate(-1000,-560);drawEarth(c,v,t*1000,{fc:68.6+lt*1.25,et:16+lt*2.2});c.restore()}

/* D · the dream: a blue too even to be real, the flock, a stranger who waves and is gone, and him on the hard flat ground, looking up */
const D0=16.95;
function shotD(c,t,v){const lt=t-D0,ts=lt+24,bg=BGS.dream,z=1+.03*eSine(clamp(lt/5));
  c.save();c.translate(960,620);c.scale(z,z);c.translate(-960,-620);
  c.drawImage(bg.base,0,0,W,H);
  crayonPass(c,g=>{for(const it of bg.items){if(it.grp)continue;const r=mulberry32(it.id*7919+v*104729+1);
    if(it.vx){const ax=it.ax!=null?it.ax:it.bb.x0,dx=(((ax+400+it.vx*ts)%2800)+2800)%2800-400-ax;crayon(g,it.pts,it.color,it.w,r,dx,0,it.pts.length,it.id*131+v*17);continue}
    if(it.k==='f'){g.save();pathPoly(g,it.clip,0,0);g.clip();crayon(g,it.pts,it.color,it.w,r,0,0,it.pts.length,it.id*131+v*17);g.restore()}
    else crayon(g,it.pts,it.color,it.w,r,0,0,it.pts.length,it.id*131+v*17)}});
  for(const grp of ['birds','gliders'])crayonPass(c,g=>{for(const it of bg.items){if(it.grp!==grp)continue;const r=mulberry32(it.id*7919+v*104729+1),ax=it.ax!=null?it.ax:it.bb.x0,dx=(((ax+400+it.vx*ts)%2800)+2800)%2800-400-ax;
    crayon(g,it.pts,it.color,it.w,r,dx,0,it.pts.length,it.id*131+v*17)}});
  const u=seg(lt,.7,4.7);
  if(u>0&&u<1){const x=lerp(-620,2540,eIO(u)),y=470-Math.sin(u*Math.PI)*90,s=2.1,wave=1.2+.55*Math.sin(lt*9);c.globalAlpha=clamp(u*7)*clamp((1-u)*7);
    crayonPass(c,g=>{drawItems(g,FL.gliderPark,x,y,s,-.04,v);const hx=x+14*s,hy=y-32*s,r=mulberry32(91+v),pts=[];
      for(let q=0;q<=16;q++){const a=q/16*7;pts.push({x:hx+Math.cos(a)*13*s*.55,y:hy+Math.sin(a)*13*s*.55})}crayon(g,pts,'#E6C7A8',10,r,0,0,undefined,7+v);
      crayon(g,arcP(hx,hy-2*s,8,6,Math.PI,Math.PI*2,8),'#4A3A30',8,r,0,0,undefined,9+v);
      crayon(g,[{x:hx+8*s,y:hy+10*s},{x:hx+8*s+Math.cos(wave)*24*s,y:hy+10*s-Math.sin(wave)*24*s}],'#3E3A48',6,r,0,0,undefined,11+v)});c.globalAlpha=1}
  c.save();c.fillStyle='rgba(60,60,84,.16)';c.beginPath();c.ellipse(252,1044,46,9,0,0,6.2832);c.fill();c.restore();
  crayonPass(c,g=>drawItems(g,FL.cusBack,250,1042,.9,0,v));
  c.restore();
  drawDreamEdge(c,t*1000)}

/* E · November: the slope at sunset, the glider tipped onto one wing */
const E0=21.3;
function shotE(c,t,v){const lt=t-E0,z=1+.04*eSine(clamp(lt/4)),bg=BGS.slope;
  c.save();c.translate(1120,640);c.scale(z,z);c.translate(-1120,-640);c.drawImage(bg.base,0,0,W,H);
  crayonPass(c,g=>{for(const it of bg.items){const r=mulberry32(it.id*7919+v*104729+1);
    if(it.k==='f'){g.save();pathPoly(g,it.clip,0,0);g.clip();crayon(g,it.pts,it.color,it.w,r,0,0,it.pts.length,it.id*131+v*17);g.restore()}
    else crayon(g,it.pts,it.color,it.w,r,0,0,it.pts.length,it.id*131+v*17)}});
  c.restore()}

/* F · the tagline, and his yellow line going across the page */
const F0=25.3;
const TRAILF=resample(catmull([[-60,676],[380,628],[760,690],[1160,612],[1560,668],[1990,590]].map(([x,y])=>({x,y})),24),5);

/* the clock: performance time until the audio is really running, then the audio's own clock, so picture and sound never drift */
const now=()=>AU.clock==='audio'?AU.ctx.currentTime:performance.now()/1000;
function startAudio(at){stopAudio();if(!AU.ctx||!AU.buf||at>=DUR)return;const s=AU.ctx.createBufferSource();s.buffer=AU.buf;s.connect(AU.gain);s.start(0,at);AU.src=s}
function stopAudio(){if(AU.src){try{AU.src.stop()}catch(e){}AU.src.disconnect();AU.src=null}}

  if(!AU.ctx){try{AU.ctx=new AudioContext();AU.gain=AU.ctx.createGain();AU.gain.gain.value=AU.muted?0:1;AU.gain.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
  playing=true;started=true;AU.clock='perf';clk0=now();t0=t;
  if(AU.ctx){if(AU.ctx.state==='running')syncAudio();else AU.ctx.resume().then(syncAudio).catch(()=>{})}
  updHud();requestAnimationFrame(loop)}
