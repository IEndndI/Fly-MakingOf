function frag(c,t,key,lt,r,p,o={}){if(p<=0)return;const v=((Math.floor(t*12)%3)+3)%3;

/* ---------- the seal (AI disclosure), the yellow line, the glyph ---------- */
const SEAL_RING='AI-ASSISTED · 约 60% · STORY & TEXT BY THE AUTHOR · 故事与文本由作者完成 · ENDND × CLAUDE · ';
function ringText(c,s,r,size,rot,prog=1,color){c.save();c.rotate(rot);c.font=`600 ${size}px ${UI}`;c.fillStyle=color;
  const chars=[...s],ws=chars.map(ch=>c.measureText(ch).width),tot=ws.reduce((a,b)=>a+b,0),gap=(2*Math.PI*r-tot)/chars.length;let acc=0;
  chars.forEach((ch,i)=>{if(i/chars.length<prog){const ang=(acc+ws[i]/2)/r;c.save();c.rotate(ang);c.translate(0,-r);c.textAlign='center';c.fillText(ch,0,size*.35);c.restore()}acc+=ws[i]+gap});c.restore()}
/* the seal: R = outer radius; parts (0–1) for circle/ticks/ring/number; n = the number shown */
function seal(c,cx,cy,R,o){const k=R/230,col=o.col||COBALT;c.save();c.translate(cx,cy);c.scale(o.sc||1,o.sc||1);c.strokeStyle=col;c.fillStyle=col;c.globalAlpha*=o.a??1;

  if((o.num??1)>0){const a=o.num??1;text(c,'AI 辅助制作',0,-58*k,`700 ${24*k}px ${CN}`,col,{a,align:'center',ls:4*k});

    text(c,'%',72*k,40*k,`600 ${48*k}px ${DISP}`,col,{a});cap(c,'Approx. · 约',0,100*k,col,{a,align:'center',size:12*k})}

const GLYPH_PARTS=[new Path2D('M40 80H705V220H40Z'),new Path2D('M555 80H705V470C705 640 760 760 850 790L930 615L985 600L995 880C995 930 960 955 900 955C720 955 555 820 555 520Z'),new Path2D('M937 117L1013 223L688 453L612 347Z')];

/* ============================== 0 · the seal (AI disclosure) ============================== */
function partHook(c,t,v){
  const cx=960,cy=470,pre=seg(t,.2,1.25),stamp=t>=1.25,impact=seg(t,1.25,1.45);

const now=()=>AU.clock==='audio'?AU.ctx.currentTime:performance.now()/1000;

  if(AU.ctx){if(AU.ctx.state==='running')syncAudio();else AU.ctx.resume().then(syncAudio).catch(()=>{})}
  updHud();requestAnimationFrame(loop)}

  else if(e.key==='0'||e.key==='Home'){seek(0)}
