/* ★ 文案都在这里 ★ */

const DUR=32.5;

/* scratch layers the library draws through (declared before it, as in the storyboard) */
const G={idx:0};
let toothC=null,cpat=null;
const ccan=document.createElement('canvas');ccan.width=1920;ccan.height=1080;const cctx=ccan.getContext('2d');
const mcan=document.createElement('canvas');mcan.width=960;mcan.height=540;const mctx=mcan.getContext('2d');

/* ======================= LIB: verbatim from index_v8.html ======================= */
/* — index_v8.html L606–610 — */
const W=1920,H=1080;
const COL=i=>120+(i-1)*142, COLR=i=>COL(i)+118;
const COBALT='#0047AB',PAPER='#F2ECDF',SUN='#F2B51F',SUN_D='#C88A0B';
const HAND='"ZCOOL KuaiLe","Noto Sans SC",sans-serif';
const $=s=>document.querySelector(s);
/* — index_v8.html L612–627 — */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,u)=>a+(b-a)*u;
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eSine=x=>-(Math.cos(Math.PI*x)-1)/2;
/* yield to the event loop without timer clamping (background tabs throttle setTimeout chains hard) */
const mch=new MessageChannel(),mq=[];mch.port1.onmessage=()=>{const r=mq.shift();if(r)r()};
const nf=()=>new Promise(r=>{mq.push(r);mch.port2.postMessage(0)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- seeded randomness ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(1);
const seed=s=>{R=mulberry32(s)};
const rnd=(a=0,b=1)=>a+(b-a)*R();
function gauss(r=R){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v)}
function hh(a){a|=0;a=Math.imul(a^a>>>16,0x45d9f3b);a=Math.imul(a^a>>>16,0x45d9f3b);return((a^a>>>16)>>>0)/4294967296}
/* — index_v8.html L629–1508 — */
/* ---------- watercolour ---------- */
function deform(p,iters,amt){
  for(let k=0;k<iters;k++){
    const q=[];
    for(let i=0;i<p.length;i++){
      const a=p[i],b=p[(i+1)%p.length];
      q.push(a);
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,v=(a.v+b.v)/2;
      const m=gauss()*len*amt*v, ang=Math.atan2(dy,dx)+Math.PI/2+gauss()*.35;
      q.push({x:(a.x+b.x)/2+Math.cos(ang)*m,y:(a.y+b.y)/2+Math.sin(ang)*m,v:v*rnd(.75,1.15)});
    }
    p=q;
  }
  return p;
}
function fillPoly(ctx,p){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fill()}
function wash(ctx,base,color,o={}){
  const {layers=30,alpha=.04,bi=2,li=3,amt=.45}=o;
  const b=deform(base,bi,amt);
  ctx.fillStyle=color;
  for(let l=0;l<layers;l++){ctx.globalAlpha=alpha*rnd(.7,1.3);fillPoly(ctx,deform(b,li,amt))}
  ctx.globalAlpha=1;
}
function ellipsePoly(cx,cy,rx,ry,n=14,v=1){const p=[];for(let i=0;i<n;i++){const a=i/n*6.2832;p.push({x:cx+Math.cos(a)*rx*rnd(.88,1.08),y:cy+Math.sin(a)*ry*rnd(.88,1.08),v:v*rnd(.6,1.3)})}return p}
function bandPoly(y0,y1,n=10,v=1){const p=[],x0=-320,x1=2240;for(let i=0;i<=n;i++)p.push({x:x0+(x1-x0)*i/n,y:y0,v:v*rnd(.5,1.4)});for(let i=n;i>=0;i--)p.push({x:x0+(x1-x0)*i/n,y:y1,v:v*rnd(.5,1.4)});return p}
function granulate(x,w,h){
  const id=x.getImageData(0,0,w,h),d=id.data,r=mulberry32(99);
  for(let i=0;i<d.length;i+=4){
    const pig=clamp(1-(d[i]+d[i+1]+d[i+2])/701);
    const n=r(), f=1-n*n*.24*Math.min(1,pig*4);
    d[i]*=f;d[i+1]*=f;d[i+2]*=f;
  }
  x.putImageData(id,0,0);
}
async function paintSky(onp){
  const c=document.createElement('canvas');c.width=960;c.height=1080;
  const x=c.getContext('2d');
  x.fillStyle=PAPER;x.fillRect(0,0,960,1080);
  x.scale(.5,.5);x.globalCompositeOperation='multiply';
  seed(11);
  const steps=[
    ()=>wash(x,bandPoly(-320,760,10,.7),'#C4DAF4',{layers:22,alpha:.032}),
    ()=>wash(x,bandPoly(-320,300,10,.7),'#B9D2F2',{layers:16,alpha:.026}),
    ()=>wash(x,bandPoly(700,1280,10,.6),'#F3E9EC',{layers:18,alpha:.024}),
    ()=>wash(x,bandPoly(1060,1740,10,.7),'#FCE7D6',{layers:22,alpha:.03}),
    ()=>wash(x,bandPoly(1460,1900,10,.6),'#F9D8C6',{layers:20,alpha:.024}),
    ()=>wash(x,ellipsePoly(1480,1840,330,240,16),'#FAE0BE',{layers:22,alpha:.022}),
    ()=>wash(x,ellipsePoly(1480,1846,124,118,14,.5),'#F4BC86',{layers:34,alpha:.045,amt:.3}),
    ()=>wash(x,bandPoly(1884,2420,14,.3),'#D2D9C3',{layers:28,alpha:.04,amt:.25}),
    ()=>wash(x,bandPoly(1975,2420,14,.4),'#BFCAB8',{layers:22,alpha:.03,amt:.3}),
  ];
  for(let i=0;i<steps.length;i++){steps[i]();onp((i+1)/(steps.length+1));await nf()}
  /* a band of real night above the title sky: the edge of the earth-moon system */
  wash(x,bandPoly(-320,150,10,.6),'#8FA5CF',{layers:14,alpha:.03});
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';
  granulate(x,960,1080);onp(1);
  return c;
}
const PAD=110;
function paintCloud(w,h,s){
  seed(s);
  const c=document.createElement('canvas');c.width=Math.ceil((w+PAD*2)/2);c.height=Math.ceil((h+PAD*2)/2);
  const x=c.getContext('2d');x.scale(.5,.5);x.translate(PAD,PAD);
  const n=4+(R()*3|0);
  for(let i=0;i<n;i++){
    const u=i/(n-1),cx=w*(.2+.6*u)+rnd(-20,20),cy=h*(.6-Math.sin(u*Math.PI)*.18)+rnd(-10,10);
    wash(x,ellipsePoly(cx,cy,w*rnd(.13,.2),h*rnd(.24,.34),12,.8),'#FBF8F0',{layers:20,alpha:.075,amt:.35});
  }
  x.globalCompositeOperation='multiply';
  wash(x,ellipsePoly(w*.5,h*.78,w*.36,h*.12,12,.6),'#CFC4DA',{layers:18,alpha:.05,amt:.3});
  return c;
}

/* ---------- crayon ---------- */
function makeTooth(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d'),id=x.createImageData(S,S),d=id.data,r=mulberry32(5);
  const grid=P=>{const g=new Float32Array(P*P);for(let i=0;i<g.length;i++)g[i]=r();return g};
  const vn=(g,P,X,Y)=>{const fx=X/S*P,fy=Y/S*P,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
    const i0=ix%P,i1=(ix+1)%P,j0=iy%P,j1=(iy+1)%P,a=g[j0*P+i0],b=g[j0*P+i1],c2=g[j1*P+i0],e=g[j1*P+i1];
    return a+(b-a)*sx+(c2-a)*sy+(a-b-c2+e)*sx*sy};
  const g1=grid(128),g2=grid(64),g3=grid(16);
  for(let Y=0;Y<S;Y++)for(let X=0;X<S;X++){
    const v=.5*vn(g1,128,X,Y)+.32*vn(g2,64,X,Y)+.18*vn(g3,16,X,Y);
    d[(Y*S+X)*4+3]=clamp((v-.28)/.3)*255;
  }
  x.putImageData(id,0,0);return c;
}
function applyTooth(ctx,pat,ox,oy){
  ctx.save();ctx.globalCompositeOperation='destination-in';ctx.globalAlpha=1;
  pat.setTransform(new DOMMatrix([1,0,0,1,ox,oy]));ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);ctx.restore();
}
function crayon(ctx,pts,color,w,r,ox,oy,n=pts.length,salt=0,am=1){
  if(n<2)return;
  ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
  const ph=r()*6.283,amp=.6+r()*.5;
  for(let p=0;p<3;p++){
    ctx.globalAlpha=(.42+.38*r())*am;
    ctx.lineWidth=w*(.55+.5*r());
    const jx=gauss(r)*w*.16,jy=gauss(r)*w*.16,k=(salt+p*7919)|0;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const q=pts[i];
      const x=q.x+ox+jx+Math.sin(i*.19+ph)*amp+(hh(i*3+k)-.5)*.9;
      const y=q.y+oy+jy+Math.cos(i*.23+ph)*amp+(hh(i*3+1+k)-.5)*.9;
      if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function crayonText(ctx,it,r,ox,oy){
  ctx.fillStyle=it.color;ctx.font=`${it.size}px ${HAND}`;ctx.textBaseline='alphabetic';
  for(const ch of it.chars){
    ctx.save();ctx.translate(ch.x+ox,ch.y+oy);ctx.rotate(ch.rot+gauss(r)*.012);ctx.scale(ch.s,ch.s);
    for(let p=0;p<3;p++){ctx.globalAlpha=.45+.35*r();ctx.fillText(ch.c,gauss(r)*1.2,gauss(r)*1.2)}
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function pathPoly(ctx,p,ox,oy){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x+ox,q.y+oy):ctx.moveTo(q.x+ox,q.y+oy));ctx.closePath()}

/* kid geometry */
function kline(x1,y1,x2,y2,wob=2.5){
  const len=Math.hypot(x2-x1,y2-y1)||1,n=Math.max(3,Math.round(len/8)),nx=-(y2-y1)/len,ny=(x2-x1)/len;
  const bow=gauss()*wob*1.2,ph=rnd(0,6.28),fr=rnd(.8,2.2),os=rnd(1,7),oe=rnd(2,9),pts=[];
  for(let i=0;i<=n;i++){const u=i/n,s=(-os+u*(len+os+oe))/len,off=Math.sin(u*Math.PI)*bow+Math.sin(ph+u*fr*6.283)*wob*.35;
    pts.push({x:x1+(x2-x1)*s+nx*off,y:y1+(y2-y1)*s+ny*off})}
  return pts;
}
function kcircle(cx,cy,r,turns=1.2){const n=Math.round(r*turns*.7)+16,a0=rnd(0,6.28),pts=[];
  for(let i=0;i<=n;i++){const u=i/n,a=a0+u*turns*6.283,rr=r*(1+.06*Math.sin(u*9+a0))+(u-.5)*r*.1;pts.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr*.95})}return pts}
function zig(poly,angle,sp,over=6){
  const ca=Math.cos(angle),sa=Math.sin(angle),rot=poly.map(p=>({u:p.x*ca+p.y*sa,v:-p.x*sa+p.y*ca}));
  let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;rot.forEach(q=>{u0=Math.min(u0,q.u);u1=Math.max(u1,q.u);v0=Math.min(v0,q.v);v1=Math.max(v1,q.v)});
  const pts=[];let dir=1;
  for(let v=v0-sp*.5;v<=v1+sp*.5;v+=sp*rnd(.8,1.2)){
    const a=dir>0?u0-over:u1+over,b=dir>0?u1+over:u0-over;
    pts.push({u:a+gauss()*3,v:v+gauss()*1.2});pts.push({u:b+gauss()*3,v:v+sp*.5+gauss()*1.2});dir*=-1;
  }
  return densify(pts.map(q=>({x:q.u*ca-q.v*sa,y:q.u*sa+q.v*ca})),7);
}
function densify(pts,step=6,closed=false){const P=closed?[...pts,pts[0]]:pts,out=[];
  for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],n=Math.max(1,Math.round(Math.hypot(b.x-a.x,b.y-a.y)/step));for(let j=0;j<n;j++)out.push({x:a.x+(b.x-a.x)*j/n,y:a.y+(b.y-a.y)*j/n})}
  out.push(P[P.length-1]);return out}
function kstar(cx,cy,r){const v=[];for(let i=0;i<=5;i++){const a=-Math.PI/2+i*4*Math.PI/5+rnd(-.05,.05);v.push({x:cx+Math.cos(a)*r*rnd(.9,1.1),y:cy+Math.sin(a)*r*rnd(.9,1.1)})}return densify(v,4)}
function bird(x,y,s){const pts=[];for(let i=0;i<=22;i++){const u=i/22;pts.push({x:x-s+u*2*s,y:y-Math.abs(Math.sin(u*Math.PI*2))*s*.42})}return pts}
function catmull(P,sg=20){const out=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let j=0;j<sg;j++){const t=j/sg,t2=t*t,t3=t2*t;out.push({x:.5*(2*p1.x+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:.5*(2*p1.y+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)})}}
  out.push(P[P.length-1]);return out}
function resample(P,step){const out=[{...P[0]}];let prev=P[0],need=step;
  for(let i=1;i<P.length;i++){let a=prev,b=P[i],d=Math.hypot(b.x-a.x,b.y-a.y);
    while(d>=need){const u=need/d,q={x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u};out.push(q);a=q;d=Math.hypot(b.x-a.x,b.y-a.y);need=step}
    need-=d;prev=b}
  return out}

let IID=1;
const bbOf=pts=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){if(p.x<a)a=p.x;if(p.y<b)b=p.y;if(p.x>c)c=p.x;if(p.y>d)d=p.y}return{x0:a,y0:b,x1:c,y1:d}};
const S=(list,pts,color,w,extra)=>list.push(Object.assign({id:IID++,k:'s',pts,color,w,bb:bbOf(pts)},extra));
const F=(list,clip,ang,sp,color,w)=>list.push({id:IID++,k:'f',clip,pts:zig(clip,ang,sp),color,w,bb:bbOf(clip)});
function handText(list,str,x0,y0,size,color){const chars=[];let x=x0;for(const c of str){const s=rnd(.9,1.12);chars.push({c,x,y:y0+gauss()*4,rot:gauss()*.08,s});x+=size*s*rnd(.9,1)}
  list.push({id:IID++,k:'t',chars,size,color,bb:{x0:x0-30,y0:y0-size*1.3,x1:x+30,y1:y0+size*.4}})}

function buildDreamItems(){
  const L=[];seed(31);
  /* yellow belongs to him alone: the window glows apricot, the sun is a child's red-orange, stars are white crayon */
  const blue='#36539A',red='#B4553E',yel='#F2A766',amber='#DE6440',grn='#5F8050',brn='#7B5B3F',gray='#4E4D58',ink='#38435F',star='#FFFBF0';
  /* horizon + grass */
  S(L,kline(-30,1892,980,1886,3),grn,6);S(L,kline(940,1888,1960,1894,3),grn,6);
  for(let x=-10;x<1940;x+=rnd(28,64)){const h=rnd(10,24);S(L,[{x,y:1893},{x:x+4,y:1893-h},{x:x+9,y:1893},{x:x+13,y:1893-h*.8},{x:x+18,y:1893}].map(p=>({x:p.x+gauss(),y:p.y+gauss()})),grn,4)}
  /* house */
  const roof=[{x:228,y:1706},{x:405,y:1584},{x:582,y:1706}];
  F(L,roof,-.5,9,red,5);
  S(L,kline(228,1706,405,1584),red,7);S(L,kline(405,1584,582,1706),red,7);S(L,kline(222,1708,588,1704),red,6);
  S(L,kline(478,1634,478,1598),red,6);S(L,kline(478,1598,512,1598),red,6);S(L,kline(512,1598,512,1658),red,6);
  S(L,kline(252,1708,250,1892),blue,6);S(L,kline(558,1708,560,1892),blue,6);
  const win=[{x:296,y:1736},{x:386,y:1736},{x:386,y:1806},{x:296,y:1806}];
  F(L,win,.7,7,yel,6);F(L,win,-.9,15,amber,4);
  S(L,kline(296,1736,386,1736,1.5),blue,5);S(L,kline(386,1736,386,1806,1.5),blue,5);S(L,kline(386,1806,296,1806,1.5),blue,5);S(L,kline(296,1806,296,1736,1.5),blue,5);
  S(L,kline(341,1738,341,1804,1),blue,4);S(L,kline(298,1771,384,1771,1),blue,4);
  S(L,kline(450,1892,450,1792),blue,5);S(L,kline(450,1792,520,1792),blue,5);S(L,kline(520,1792,520,1892),blue,5);
  /* tree */
  S(L,kline(690,1892,694,1770),brn,6);S(L,kline(714,1892,710,1770),brn,6);

/* ============================== the clock ============================== */
let t=0,playing=false,clk0=0,t0=0,started=false,hudForced=false;
const hud=document.getElementById('hud');
/* the clock: performance time until the audio is really running, then the audio's own clock, so picture and sound never drift */
const now=()=>AU.clock==='audio'?AU.ctx.currentTime:performance.now()/1000;
function startAudio(at){stopAudio();if(!AU.ctx||!AU.buf||at>=DUR)return;const s=AU.ctx.createBufferSource();s.buffer=AU.buf;s.connect(AU.gain);s.start(0,at);AU.src=s}

function syncAudio(){if(!playing||!AU.ctx||AU.ctx.state!=='running'||!AU.buf)return;const cur=clamp(t0+(now()-clk0),0,DUR);AU.clock='audio';t0=cur;clk0=AU.ctx.currentTime;startAudio(cur)}
function play(){if(!ready||playing)return;if(t>=DUR)t=0;
  if(!AU.ctx){try{AU.ctx=new AudioContext();AU.gain=AU.ctx.createGain();AU.gain.gain.value=AU.muted?0:1;AU.gain.connect(AU.ctx.destination)}catch(e){AU.ctx=null}}
  playing=true;started=true;AU.clock='perf';clk0=now();t0=t;
  if(AU.ctx){if(AU.ctx.state==='running')syncAudio();else AU.ctx.resume().then(syncAudio).catch(()=>{})}
  updHud();requestAnimationFrame(loop)}
function pause(){if(!playing)return;t=clamp(t0+(now()-clk0),0,DUR);playing=false;stopAudio();render(t);updHud()}
function seek(x){t=clamp(+x||0,0,DUR);if(playing){clk0=now();t0=t;if(AU.clock==='audio')startAudio(t)}render(t);updHud();return t}
function loop(){if(!playing)return;t=t0+(now()-clk0);if(t>=DUR){t=DUR;playing=false;stopAudio();render(t);updHud();return}render(t);requestAnimationFrame(loop)}
function updHud(){const show=hudForced||(!started&&!playing);hud.hidden=!show;if(!show)return;
  hud.textContent=!ready?hud.textContent:`飞 Fly · PV 01 — ${t.toFixed(2)} / ${DUR.toFixed(1)} s${AU.buf?'':' · 音轨生成中'}\n空格 播放/暂停 · ← → 逐帧 (Shift 1 s) · 0 回到开头 · M 静音${AU.muted?'（已静音）':''} · W 导出音轨 · H 隐藏提示`}
function fit(){const c=document.getElementById('pv'),s=Math.min(innerWidth/W,innerHeight/H);c.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
function saveWav(){if(!AU.buf)return;const a=document.createElement('a');a.href=URL.createObjectURL(wavOf(AU.buf));a.download='fly_pv01_audio.wav';document.body.appendChild(a);a.click();a.remove()}
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play()}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();if(playing)pause();seek(t+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?1:1/60))}
  else if(e.key==='0'||e.key==='Home'){seek(0)}
  else if(e.key==='m'||e.key==='M'){AU.muted=!AU.muted;if(AU.gain)AU.gain.gain.value=AU.muted?0:1;updHud()}
  else if(e.key==='w'||e.key==='W'){saveWav()}
