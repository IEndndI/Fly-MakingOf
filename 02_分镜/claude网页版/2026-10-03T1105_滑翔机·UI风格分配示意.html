<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滑翔机 · UI 风格分配示意</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#ecebe6; --ink:#24222a; --ink-soft:#5d5a66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#16151b; --ink:#eceaf2; --ink-soft:#a19dad; } }
:root[data-theme="dark"]{ --page:#16151b; --ink:#eceaf2; --ink-soft:#a19dad; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
main{max-width:1240px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;font-size:clamp(26px,4vw,40px);margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--ink-soft);margin:0 0 40px;max-width:60ch}
section{margin:0 0 56px}
h2{font-family:"Noto Serif SC","Songti SC",serif;font-weight:500;font-size:22px;margin:0 0 4px}
.note{color:var(--ink-soft);margin:0 0 16px;font-size:15px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px}
figure{margin:0}
figcaption{font-size:13px;color:var(--ink-soft);margin-top:6px}

.frame{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:6px;container-type:inline-size;isolation:isolate}
.frame .figure{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:22cqw;height:78cqh;border-radius:45% 45% 8% 8%/30% 30% 4% 4%;}
.frame .figure span{position:absolute;inset:auto 0 42%;text-align:center;font-size:1.5cqw;letter-spacing:.1em}

.ground{background:
  radial-gradient(120% 70% at 75% 95%,#f3b679 0%,rgba(243,182,121,0) 60%),
  linear-gradient(180deg,#8e9db0 0%,#c9a98c 52%,#d59a6c 72%,#6d5446 100%);}
.ground::before{content:"";position:absolute;inset:auto -5% 0;height:28%;background:#4b3b33;clip-path:polygon(0 60%,18% 35%,38% 52%,60% 22%,80% 44%,100% 30%,100% 100%,0 100%);opacity:.85}
.ground::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,240,220,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.ground .figure{background:rgba(70,52,44,.35);border:1px dashed rgba(255,235,210,.5)}
.ground .figure span{color:rgba(255,240,225,.8)}

.space{background:
  radial-gradient(40% 50% at 22% 30%,rgba(181,108,255,.55),transparent 70%),
  radial-gradient(45% 55% at 80% 65%,rgba(64,152,255,.5),transparent 70%),
  radial-gradient(30% 30% at 60% 20%,rgba(255,120,210,.35),transparent 70%),
  #0b0a24;}
.space::before{content:"";position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 33% 72%,#dfe8ff 50%,transparent 51%),
  radial-gradient(2px 2px at 54% 12%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 70% 40%,#ffe9ff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 88% 22%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 8% 60%,#cfe0ff 50%,transparent 51%),
  radial-gradient(2px 2px at 42% 44%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 92% 78%,#fff 50%,transparent 51%);animation:tw 4s ease-in-out infinite alternate}
.space::after{content:"";position:absolute;left:-10%;right:-10%;top:55%;height:14%;transform:rotate(-8deg);background:repeating-radial-gradient(circle at 30% 50%,rgba(200,170,255,.5) 0 2px,transparent 2px 22px);opacity:.5}
.space .figure{background:rgba(160,140,255,.12);border:1px dashed rgba(210,200,255,.5)}
.space .figure span{color:rgba(225,220,255,.85)}
@keyframes tw{from{opacity:.55}to{opacity:1}}

.ui{position:absolute;inset:0;z-index:2}
.name{position:absolute;font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;font-size:2.3cqw;line-height:1}
.box{position:absolute;left:6%;right:6%;bottom:5%;height:24%;padding:3.2cqw 4cqw 2cqw;font-size:1.75cqw;line-height:1.8}
.choices{position:absolute;right:7%;top:16%;display:flex;flex-direction:column;gap:1.4cqw;width:30%}
.choices div{font-size:1.6cqw;padding:1.1cqw 2cqw}

/* graphic-block family */
.g-warm .box{background:#2b211d;color:#f6e7d3;clip-path:polygon(0 12%,100% 0,98.5% 100%,1% 100%)}
.g-warm .box::before{content:"";position:absolute;left:-1%;top:6%;width:18%;height:8%;background:#e0874a;transform:skewX(-20deg)}
.g-warm .name{left:7%;bottom:27.5%;background:#e0874a;color:#2b211d;padding:1cqw 2.6cqw;transform:rotate(-3deg);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.g-warm .choices div{background:#f1dcc0;color:#2b211d;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);transform:rotate(-2deg)}
.g-warm .choices div:first-child{background:#e0874a}

.g-cold .box{background:#160f3a;color:#efeaff;clip-path:polygon(0 12%,100% 0,98.5% 100%,1% 100%)}
.g-cold .box::before{content:"";position:absolute;left:-1%;top:6%;width:18%;height:8%;background:#6ee7ff;transform:skewX(-20deg)}
.g-cold .name{left:7%;bottom:27.5%;background:#b06cff;color:#0e0930;padding:1cqw 2.6cqw;transform:rotate(-3deg);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.g-cold .choices div{background:#efeaff;color:#160f3a;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);transform:rotate(-2deg)}
.g-cold .choices div:first-child{background:#6ee7ff}

/* glass-glow family */
.l-warm .box{background:rgba(255,236,214,.18);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,226,190,.55);border-radius:1.4cqw;color:#fff6ea;box-shadow:0 0 2.4cqw rgba(255,190,120,.35),inset 0 0 1.6cqw rgba(255,220,180,.25);text-shadow:0 1px 6px rgba(60,30,10,.4)}
.l-warm .name{left:8.5%;bottom:30.5%;color:#fff3e2;text-shadow:0 0 1.2cqw rgba(255,180,100,.9)}
.l-warm .choices div{background:rgba(255,236,214,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,226,190,.5);border-radius:3cqw;color:#fff6ea;text-align:center}
.l-warm .choices div:first-child{box-shadow:0 0 1.8cqw rgba(255,190,120,.6)}

.l-cold .box{background:rgba(160,150,255,.12);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);border:1px solid rgba(190,200,255,.55);border-radius:1.4cqw;color:#f1efff;box-shadow:0 0 2.6cqw rgba(140,120,255,.45),inset 0 0 1.6cqw rgba(120,190,255,.25)}
.l-cold .name{left:8.5%;bottom:30.5%;color:#f4f0ff;text-shadow:0 0 1.2cqw rgba(176,108,255,1),0 0 2.6cqw rgba(64,152,255,.7)}
.l-cold .choices div{background:rgba(160,150,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(190,200,255,.5);border-radius:3cqw;color:#f1efff;text-align:center}
.l-cold .choices div:first-child{box-shadow:0 0 1.8cqw rgba(110,231,255,.7)}

/* fused family: slanted glass with glowing cut edge */
.f-warm .box,.f-cold .box{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);clip-path:polygon(0 12%,100% 0,98.5% 100%,1% 100%)}
.f-warm .box{background:linear-gradient(100deg,rgba(255,232,205,.26),rgba(255,232,205,.1));color:#fff6ea;border-top:0.35cqw solid #f0a15f}
.f-cold .box{background:linear-gradient(100deg,rgba(176,160,255,.22),rgba(110,200,255,.08));color:#f1efff;border-top:0.35cqw solid #6ee7ff}
.f-warm .name,.f-cold .name{left:7%;bottom:27.5%;padding:1cqw 2.6cqw;transform:rotate(-3deg);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.f-warm .name{background:rgba(240,161,95,.85);color:#2b211d}
.f-cold .name{background:rgba(176,108,255,.8);color:#fff}
.f-warm .choices div,.f-cold .choices div{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);transform:rotate(-2deg)}
.f-warm .choices div{background:rgba(255,232,205,.2);color:#fff6ea;border-left:0.5cqw solid #f0a15f}
.f-cold .choices div{background:rgba(176,160,255,.16);color:#f1efff;border-left:0.5cqw solid #6ee7ff}
.f-warm .choices div:first-child{background:rgba(240,161,95,.55)}
.f-cold .choices div:first-child{background:rgba(110,231,255,.35)}

@media (prefers-reduced-motion:reduce){.space::before{animation:none}}
</style>
</head>
<body>
<main>
  <h1>滑翔机 · UI 风格分配</h1>
  <p class="lead">同一组对话框、名字框和选项，放在地面（暖、褪色）和太空（紫蓝、绚烂）两种场景里。背景和立绘位置只是占位，重点看 UI 和画面合不合。</p>

  <section>
    <h2>方案 A　地面用色块，太空用光</h2>
    <p class="note">现实是硬的、有棱角的；进入梦境后，界面也一起变得透明发光。</p>
    <div class="pair">
      <figure><div class="frame ground g-warm"><div class="figure"><span>立绘</span></div><div class="ui"><div class="choices"><div>把它收起来</div><div>再试一次</div></div><div class="name">男孩</div><div class="box">风从坡下吹上来，手里的翅膀轻轻发抖。</div></div></div><figcaption>地面</figcaption></figure>
      <figure><div class="frame space l-cold"><div class="figure"><span>立绘</span></div><div class="ui"><div class="choices"><div>继续往上</div><div>回头看看</div></div><div class="name">男孩</div><div class="box">脚下的星星，一颗一颗慢慢亮起来。</div></div></div><figcaption>太空</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>方案 B　地面用光，太空用色块</h2>
    <p class="note">现实是柔和的回忆，暖光透过毛玻璃；梦里反而锋利、张扬、像海报。</p>
    <div class="pair">
      <figure><div class="frame ground l-warm"><div class="figure"><span>立绘</span></div><div class="ui"><div class="choices"><div>把它收起来</div><div>再试一次</div></div><div class="name">男孩</div><div class="box">风从坡下吹上来，手里的翅膀轻轻发抖。</div></div></div><figcaption>地面</figcaption></figure>
      <figure><div class="frame space g-cold"><div class="figure"><span>立绘</span></div><div class="ui"><div class="choices"><div>继续往上</div><div>回头看看</div></div><div class="name">男孩</div><div class="box">脚下的星星，一颗一颗慢慢亮起来。</div></div></div><figcaption>太空</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>方案 C　两者融合</h2>
    <p class="note">同一套斜切骨架，材质是半透明玻璃，切口处发光；地面配橙，太空配青紫。</p>
    <div class="pair">
      <figure><div class="frame ground f-warm"><div class="figure"><span>立绘</span></div><div class="ui"><div class="choices"><div>把它收起来</div><div>再试一次</div></div><div class="name">男孩</div><div class="box">风从坡下吹上来，手里的翅膀轻轻发抖。</div></div></div><figcaption>地面</figcaption></figure>
      <figure><div class="frame space f-cold"><div class="figure"><span>立绘</span></div><div class="ui"><div class="choices"><div>继续往上</div><div>回头看看</div></div><div class="name">男孩</div><div class="box">脚下的星星，一颗一颗慢慢亮起来。</div></div></div><figcaption>太空</figcaption></figure>
    </div>
  </section>
</main>
</body>
</html>
